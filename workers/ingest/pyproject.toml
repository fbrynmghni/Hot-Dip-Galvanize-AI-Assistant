[project]
name = "galva-ingest"
version = "0.1.0"
description = "GalvaAI ingestion pipeline: crawl -> clean -> chunk -> embed (AGA only for now, see references/legal.md)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "trafilatura>=1.12",
    "pdfplumber>=0.11",
    "pydantic>=2.9",
    "openai>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "respx>=0.21"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
